<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport"
          content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>OSMD WebView Engine</title>
    <!-- Local library files for faster, offline loading -->
    <!-- OSMD Core -->
    <script src="file:///android_asset/opensheetmusicdisplay.min.js"></script>
    <!-- OSMD Audio Player Plugin -->
    <script src="file:///android_asset/OsmdAudioPlayer.min.js"></script>
    <!-- Files origin credit:
    https://unpkg.com/opensheetmusicdisplay/build/opensheetmusicdisplay.min.js
    https://unpkg.com/osmd-audio-player/umd/OsmdAudioPlayer.min.js
    -->

    <style>
        body {
            margin: 0;
            padding: 0;
            background: white;
            overflow-x: hidden;
            -webkit-tap-highlight-color: transparent;
        }
        #osmd-container {
            width: 100%;
        }
        /* Hide scrollbars for app feel */
        ::-webkit-scrollbar {
            display: none;
        }
    </style>
</head>
<body>
<div id="osmd-container"></div>

</body>
<script type="text/javascript">

    /* ---------------------- FUNCTIONS --------------------------- */

        function enableClickToSeek(playbackManager, osmd) {
    const svgElement = document.querySelector("#osmd-container svg");
    if (!svgElement) return;

    svgElement.addEventListener("click", (event) => {
        // 1. Get raw SVG coordinates
        const pt = svgElement.createSVGPoint();
        pt.x = event.clientX;
        pt.y = event.clientY;
        const ctm = svgElement.getScreenCTM();
        if (!ctm) return;

        const svgP = pt.matrixTransform(ctm.inverse());
        const clickX = svgP.x / 10;
        const clickY = svgP.y / 10;

        // 2. Grab all playback steps directly
        const containers = osmd.graphic?.verticalGraphicalStaffEntryContainers;
        if (!containers || containers.length === 0) return;

        let exactTargetStep = -1;
        let minXDistance = Infinity;

        // 3. Scan containers to find the closest one on the clicked line
        for (let i = 0; i < containers.length; i++) {
            const container = containers[i];

            // Just check the first valid note in this vertical slice
            const firstEntry = container.staffEntries.find(e => e && e.PositionAndShape);
            if (!firstEntry) continue;

            const noteX = firstEntry.PositionAndShape.AbsolutePosition.x;
            const noteY = firstEntry.PositionAndShape.AbsolutePosition.y;

            // Check if the click is on the same vertical row (+/- 15 units is a generous buffer for a staff)
            if (Math.abs(clickY - noteY) < 15) {
                // Find the closest note horizontally
                const distX = Math.abs(clickX - noteX);

                if (distX < minXDistance) {
                    minXDistance = distX;
                    exactTargetStep = i;
                }
            }
        }

        // 4. Trigger the jump if we found a valid step
        if (exactTargetStep !== -1) {
            console.log(`Jumping to precise step #${exactTargetStep}`);

            if (window.AndroidInterface && window.AndroidInterface.onStepSelected) {
                window.AndroidInterface.onStepSelected(exactTargetStep);
            }

            const wasPlaying = playbackManager.state === "PLAYING";

            if (wasPlaying) {
                playbackManager.pause();
                if (typeof playbackManager.clearTimeouts === 'function') playbackManager.clearTimeouts();
            }

            playbackManager.jumpToStep(exactTargetStep);

            if (playbackManager.cursor && playbackManager.iterator) {
                playbackManager.cursor.Iterator = playbackManager.iterator;
                playbackManager.cursor.update();
            }

            if (wasPlaying) {
                setTimeout(() => playbackManager.play(), 50);
            }
        }
    });
}





    let osmd;
    let playbackManager;

    const mixerState = {
        volumes: [], // index -> 0-1
        mutes: [],   // index -> bool
        solos: []    // index -> bool
    };

    function applyMixer() {
        if (!playbackManager || !playbackManager.scoreInstruments) return;
        
        const hasSolo = mixerState.solos.some(s => s);
        
        playbackManager.scoreInstruments.forEach((instrument, i) => {
            let finalVolume = mixerState.volumes[i] !== undefined ? mixerState.volumes[i] : 1.0;
            
            if (hasSolo) {
                if (!mixerState.solos[i]) finalVolume = 0;
            } else if (mixerState.mutes[i]) {
                finalVolume = 0;
            }
            
            instrument.Voices.forEach(voice => {
                voice.Volume = finalVolume;
            });
        });
    }

    // Initialize OSMD Visual Engine
    osmd = new opensheetmusicdisplay.OpenSheetMusicDisplay("osmd-container", {
        autoResize: true,
        backend: "svg",
        drawTitle: true,
        followCursor: true,
        cursorsOptions: [{type: 0, color: "#33e02f", alpha: 0.5, follow: true}]
    });

    osmd.EngravingRules.CursorIgnoreRepetitions = false;

    // Initialize Audio Timing Engine
    playbackManager = new OsmdAudioPlayer();


    function waitForDOMUpdate() {
    return new Promise(resolve => {
        // requestAnimationFrame waits for the next screen repaint
        requestAnimationFrame(() => {
            // A tiny timeout ensures the layout calculation is fully complete
            setTimeout(resolve, 50);
        });
    });
}

    /**
     * Expose this named function to window for easy access via java's evaluateJavascript function.
     */
    window.loadScore = async function(url, zoomLevel) {
        try {
            console.log("WebView: Loading " + url);
            await osmd.load(url);
            osmd.zoom = zoomLevel;
            osmd.render();
            await waitForDOMUpdate();

            await playbackManager.loadScore(osmd);

            // Initialize mixer state arrays
            mixerState.volumes = playbackManager.scoreInstruments.map(() => 1.0);
            mixerState.mutes = playbackManager.scoreInstruments.map(() => false);
            mixerState.solos = playbackManager.scoreInstruments.map(() => false);

            enableClickToSeek(playbackManager, osmd);

            osmd.cursor.show();
            console.log("WebView: Ready");
            if (window.AndroidInterface) {
                window.AndroidInterface.onLoadScoreFinished();
            }
            return "SUCCESS";
        } catch (e) {
            console.error("WebView Load Error: " + e.message);
            return "ERROR";
        }
    };

    /**
     * Named function to Play.
     */
    window.play = async function() {
        const ac = playbackManager.ac;
        if (ac && ac.state === 'suspended') {
            await ac.resume();
        }
        playbackManager.play();
        console.log("WebView: Playing");
    };

    /**
     * Named function to Pause.
     */
    window.pause = function() {
        playbackManager.pause();
        console.log("WebView: Paused");
    };

    /**
     * Named function to Stop.
     * Changed to pause and jump to start to keep the engine "hot" for faster restarts.
     */
    window.stop = function() {
        playbackManager.pause();
        playbackManager.jumpToStep(0);
        if (playbackManager.cursor && playbackManager.iterator) {
            playbackManager.cursor.Iterator = playbackManager.iterator;
            playbackManager.cursor.update();
        }
        console.log("WebView: Stopped (Reset to 0)");
    };

    /**
     * Named function to change BPM.
     */
    window.setBpm = function(bpm) {
        playbackManager.setBpm(parseInt(bpm));
        console.log("WebView: BPM set to " + bpm);
    };

    window.wakeUpAudio = async function() {
        console.log("WebView: Waking up from background...");

        // Safely check if the playback manager and its audio context exist
        if (typeof playbackManager !== 'undefined' &&
            playbackManager.audioPlayer &&
            playbackManager.audioPlayer.context) {

            const audioCtx = playbackManager.audioPlayer.context;

            // If the OS suspended the audio context, force it to resume
            if (audioCtx.state === 'suspended') {
                try {
                    await audioCtx.resume();
                    console.log("WebView: AudioContext successfully resumed.");
                } catch (e) {
                    console.error("WebView: Failed to resume AudioContext", e);
                }
            } else {
                console.log("WebView: AudioContext was already running.");
            }
        }
    };

    // Optional: A helper to ensure music stops when the app is minimized
    window.pauseMusic = function() {
        if (typeof playbackManager !== 'undefined' && playbackManager.state === 'PLAYING') {
            playbackManager.pause();
        }
    };

    /**
     * Cleans up the engine to prevent memory leaks and stop audio.
     */
    window.destroyEngine = async function() {
        console.log("WebView: Destroying engine...");
        try {
            if (playbackManager) {
                playbackManager.stop();
                if (playbackManager.ac) {
                    await playbackManager.ac.close();
                }
            }
            if (osmd) {
                osmd.clear();
            }
            playbackManager = null;
            osmd = null;
            console.log("WebView: Engine destroyed successfully.");
        } catch (e) {
            console.error("WebView: Error during engine destruction: " + e.message);
        }
    };

    window.syncCursorPosition = function() {
    if (osmd && osmd.cursor && playbackManager && playbackManager.iterator) {
        // Re-assign the iterator to ensure it's pointing to the audio engine's current step
        osmd.cursor.Iterator = playbackManager.iterator;
        // Force a visual update of the SVG element
        osmd.cursor.update();
        console.log("WebView: Cursor synced manually.");
    }
};

    /**
     * Advanced mixer control for a specific part.
     * @param partIndex The 0-based index of the instrument.
     * @param volume Final volume (0.0 to 1.0).
     * @param mute Boolean, true to mute this track.
     * @param solo Boolean, true to solo this track (mutes all non-soloed tracks).
     */
    window.setPartMix = function(partIndex, volume, mute, solo) {
        if (mixerState.volumes[partIndex] === undefined) {
            console.error(`WebView: Part index ${partIndex} out of bounds.`);
            return;
        }
        
        mixerState.volumes[partIndex] = volume;
        mixerState.mutes[partIndex] = mute;
        mixerState.solos[partIndex] = solo;
        
        applyMixer();
        console.log(`WebView: Updated Mix for part ${partIndex} -> Vol: ${volume}, Mute: ${mute}, Solo: ${solo}`);
    };

    /**
     * Mute or unmute a specific part (instrument) by its index.
     * Simplified helper that keeps current volume/solo state.
     */
    window.setPartMute = function(partIndex, mute) {
        if (mixerState.mutes[partIndex] !== undefined) {
            mixerState.mutes[partIndex] = mute;
            applyMixer();
        }
    };

    window.addEventListener('resize', () => {
    // When Android resizes the WebView, tell OSMD to catch up
    osmd.render();
});


    // Auto-load default example so something is visible immediately
    // delete me before deploying
    // window.loadScore("https://opensheetmusicdisplay.github.io/demo/Mozart_String_Quartet_in_G_K._387_1st_Mvmnt_excerpt.musicxml");

    // Callback to android onEngineReady web-interface function
    if (window.AndroidInterface) {
        window.AndroidInterface.onEngineReady();
    }


</script>


<!--   Android Java Control Guide
  To control the sheet music player from your Android Java code, you will use the evaluateJavascript method. Here are the commands you should evaluate:
  1. Start Playback
  This function also handles resuming the AudioContext, which is required for sound to work in WebViews.
   1 webView.evaluateJavascript("play();", null);

  2. Pause Playback
   1 webView.evaluateJavascript("pause();", null);

  3. Stop and Reset
  Stops the music and returns the cursor to the beginning.
   1 webView.evaluateJavascript("stop();", null);

  4. Change Tempo (BPM)
  Pass the desired beats per minute as an integer.
   1 int bpm = 140;
   2 webView.evaluateJavascript("setBpm(" + bpm + ");", null);

  5. Load a New Score
  Use this to switch between different MusicXML files dynamically.
   1 String scoreUrl = "https://example.com/my_song.xml";
   2 webView.evaluateJavascript("loadScore('" + scoreUrl + "');", null);

  6. Mute/Unmute a Part
  Pass the part index (0-based) and the mute state (true/false).
   1 int partIndex = 0; // First instrument
   2 boolean mute = true;
   3 webView.evaluateJavascript("setPartMute(" + partIndex + ", " + mute + ");", null);

  7. Full Mixer Control
  Set volume, mute, and solo for a part simultaneously.
   1 float volume = 0.8f;
   2 boolean mute = false;
   3 boolean solo = true;
   4 webView.evaluateJavascript("setPartMix(0, " + volume + ", " + mute + ", " + solo + ");", null);
    -->
</body>
</html>
